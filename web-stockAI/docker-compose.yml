services:
  backend:
    build: ./backend
    container_name: webstock-backend
    ports:
      - "8005:8005"
    volumes:
      - ./backend:/app
      - ../scylla-cdc-printer:/cdc-printer:ro
    environment:
      - PYTHONUNBUFFERED=1
      - REALTIME_TRADING_HOURS_ONLY=${REALTIME_TRADING_HOURS_ONLY:-true}
      - WS_ALLOWED_ORIGINS=${WS_ALLOWED_ORIGINS:-}
      - CASSANDRA_HOST=["scylla-node1","scylla-node2","scylla-node3"]
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=stock_data
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - CDC_PRINTER_PATH=/cdc-printer/target/release/scylla-cdc-printer
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-169634127018-b3sq9e202f16lib2ch7a1uj9tph966r8.apps.googleusercontent.com}
      - WAREHOUSE_HOST=${WAREHOUSE_HOST:-warehouse-db}
      - WAREHOUSE_PORT=${WAREHOUSE_PORT:-5432}
      - WAREHOUSE_DB=${WAREHOUSE_DB:-warehouse}
      - WAREHOUSE_USER=${WAREHOUSE_USER:-warehouse_user}
      - WAREHOUSE_PASSWORD=${WAREHOUSE_PASSWORD:-warehouse_pass}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - autoheal=true
    restart: always
    networks:
      financi-network:
        ipv4_address: 172.18.0.123

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.kytran.io.vn}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-https://api.kytran.io.vn}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-169634127018-b3sq9e202f16lib2ch7a1uj9tph966r8.apps.googleusercontent.com}
    container_name: webstock-frontend
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.kytran.io.vn}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-https://api.kytran.io.vn}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-169634127018-b3sq9e202f16lib2ch7a1uj9tph966r8.apps.googleusercontent.com}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - autoheal=true
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - financi-network
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: webstock-cloudflared
    command: tunnel --no-autoupdate run --token ${API_KEY_CLOUDFLARE}
    restart: unless-stopped
    networks:
      - financi-network
      
networks:
  financi-network:
    external: true