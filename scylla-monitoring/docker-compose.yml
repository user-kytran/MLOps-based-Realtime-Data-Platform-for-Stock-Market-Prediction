services:
  host-hardware-exporter:
    image: python:3.11-slim
    container_name: host-hardware-exporter
    restart: unless-stopped
    command: python /app/exporter.py
    volumes:
      - ./hardware-exporter:/app:ro
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
    environment:
      - SYS_PATH=/host/sys
      - PROC_PATH=/host/proc
      - GATEWAY_IP=192.168.13.1
      - HC_PING_URL=https://hc-ping.com/80eb57aa-0fb3-4f4e-aafb-252832041ccf
      - TZ=Asia/Ho_Chi_Minh
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      financi-network:
        aliases:
          - host-hardware-exporter

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: aalert
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:z
      - /etc/localtime:/etc/localtime:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--log.level=debug'
    environment:
      - TZ=Asia/Ho_Chi_Minh
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      financi-network:
        aliases:
          - alertmanager

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aprom
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus_data:/prometheus/data:Z
      - ./prometheus/build/prometheus.yml:/etc/prometheus/prometheus.yml:z
      - ./prometheus/prom_rules/:/etc/prometheus/prom_rules/:z
      - ./prometheus/scylla_servers.yml:/etc/scylla.d/prometheus/targets/scylla_servers.yml:z
      - ./prometheus/scylla_servers.yml:/etc/scylla.d/prometheus/targets/node_exporter_servers.yml:z
      - ./prometheus/scylla_servers.yml:/etc/scylla.d/prometheus/targets/scylla_manager_agents.yml:z
      - ./prometheus/scylla_manager_servers.example.yml:/etc/scylla.d/prometheus/targets/scylla_manager_servers.yml:z
      - ./prometheus/stock_backend_servers.yml:/etc/scylla.d/prometheus/stock_backend_servers.yml:z
      - ./prometheus/stock_producer_servers.yml:/etc/scylla.d/prometheus/stock_producer_servers.yml:z
      - ./prometheus/flink_servers.yml:/etc/scylla.d/prometheus/flink_servers.yml:z
      - ./prometheus/host_hardware_servers.yml:/etc/scylla.d/prometheus/host_hardware_servers.yml:z
      - /etc/localtime:/etc/localtime:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus/data'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=3GB'
      - '--storage.tsdb.wal-compression'
      - '--web.enable-lifecycle'
      - '--enable-feature=promql-experimental-functions'
    environment:
      - TZ=Asia/Ho_Chi_Minh
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    depends_on:
      - alertmanager
      - host-hardware-exporter
    networks:
      financi-network:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:12.1.0
    container_name: agraf
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "3000:3000"
      - "1020:3000"
    volumes:
      - ./grafana/build:/var/lib/grafana/dashboards:z
      - ./grafana/dashboards/stock-cdc:/var/lib/grafana/dashboards/stock-cdc:z
      - ./grafana/plugins:/var/lib/grafana/plugins:z
      - ./grafana/provisioning:/var/lib/grafana/provisioning:z
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - GF_DEFAULT_TIMEZONE=Asia/Ho_Chi_Minh
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_PATHS_PROVISIONING=/var/lib/grafana/provisioning
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=scylladb-scylla-datasource
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_SECURITY_ANGULAR_SUPPORT_ENABLED=false
      - GF_SERVER_ENABLE_GZIP=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ver_5.2/scylla-overview.5.2.json
    logging:
      driver: "json-file"
      options:
        max-size: "30m"
        max-file: "3"
    depends_on:
      - prometheus
    networks:
      financi-network:
        aliases:
          - grafana

networks:
  financi-network:
    external: true
